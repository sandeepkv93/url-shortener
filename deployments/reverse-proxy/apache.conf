# Apache Reverse Proxy Configuration for URL Shortener Service
# This configuration provides a production-ready setup with SSL termination,
# load balancing, and proper header forwarding.

# Enable required modules
# a2enmod ssl
# a2enmod rewrite
# a2enmod proxy
# a2enmod proxy_http
# a2enmod proxy_balancer
# a2enmod lbmethod_byrequests
# a2enmod headers
# a2enmod deflate
# a2enmod expires

# Define backend servers for load balancing
ProxyPreserveHost On
ProxyRequests Off

# Backend pool definition
<Proxy balancer://url-shortener-backend>
    BalancerMember http://127.0.0.1:8080 status=+H
    BalancerMember http://127.0.0.1:8081 status=+H
    ProxySet lbmethod=byrequests
    ProxySet hcmethod=GET
    ProxySet hcuri=/health
</Proxy>

# HTTP Virtual Host (redirect to HTTPS)
<VirtualHost *:80>
    ServerName yourdomain.com
    ServerAlias www.yourdomain.com
    
    # Redirect all HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    
    # Log configuration
    ErrorLog ${APACHE_LOG_DIR}/url_shortener_error.log
    CustomLog ${APACHE_LOG_DIR}/url_shortener_access.log combined
</VirtualHost>

# HTTPS Virtual Host
<VirtualHost *:443>
    ServerName yourdomain.com
    ServerAlias www.yourdomain.com
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/yourdomain.com.crt
    SSLCertificateKeyFile /etc/ssl/private/yourdomain.com.key
    SSLCertificateChainFile /etc/ssl/certs/yourdomain.com.ca-bundle
    
    # SSL Security Settings
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder Off
    SSLCompression off
    SSLUseStapling on
    SSLStaplingCache "shmcb:logs/stapling-cache(150000)"
    
    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';"
    
    # Hide Apache version
    ServerTokens Prod
    ServerSignature Off
    
    # Enable compression
    <Location />
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png|ico)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.pdf$ no-gzip dont-vary
    </Location>
    
    # Request size limit
    LimitRequestBody 10485760  # 10MB
    
    # Timeout settings
    TimeOut 60
    
    # API endpoints with proxy configuration
    <LocationMatch "^/api/">
        ProxyPass balancer://url-shortener-backend/api/
        ProxyPassReverse balancer://url-shortener-backend/api/
        
        # Set proxy headers
        ProxyPreserveHost On
        ProxyPassReverse /
        
        # Forward real IP information
        ProxyAddHeaders On
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
        
        # Rate limiting (requires mod_security or similar)
        # SecRuleEngine On
        # SecRule REQUEST_URI "@contains /api/" "phase:1,ratelimit,msg:'API Rate Limit',id:1001"
        
        # Timeout for API requests
        ProxyTimeout 60
    </LocationMatch>
    
    # Short URL redirection (higher priority)
    <LocationMatch "^/[a-zA-Z0-9]{6,8}$">
        ProxyPass balancer://url-shortener-backend/
        ProxyPassReverse balancer://url-shortener-backend/
        
        ProxyPreserveHost On
        ProxyAddHeaders On
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
        
        # Cache redirects briefly
        ExpiresActive On
        ExpiresByType text/html "access plus 5 minutes"
        
        # Faster timeout for redirects
        ProxyTimeout 30
    </LocationMatch>
    
    # Health check endpoint
    <Location "/health">
        ProxyPass balancer://url-shortener-backend/health
        ProxyPassReverse balancer://url-shortener-backend/health
        
        ProxyPreserveHost On
        ProxyAddHeaders On
        
        # No logging for health checks
        SetEnvIf Request_URI "^/health$" dontlog
        CustomLog ${APACHE_LOG_DIR}/url_shortener_access.log combined env=!dontlog
    </Location>
    
    # Metrics endpoint (restricted access)
    <Location "/metrics">
        ProxyPass balancer://url-shortener-backend/metrics
        ProxyPassReverse balancer://url-shortener-backend/metrics
        
        ProxyPreserveHost On
        ProxyAddHeaders On
        
        # Restrict access to internal networks
        Require ip 127.0.0.1
        Require ip 10.0.0.0/8
        Require ip 172.16.0.0/12
        Require ip 192.168.0.0/16
        
        SetEnvIf Request_URI "^/metrics$" dontlog
    </Location>
    
    # Static files (if serving frontend through Apache)
    <Directory "/var/www/url-shortener/static/">
        Options -Indexes
        AllowOverride None
        Require all granted
        
        # Cache static files
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header append Cache-Control "public, immutable"
        
        # Security for static files
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options DENY
    </Directory>
    
    Alias /static /var/www/url-shortener/static
    
    # Block common attack patterns
    <LocationMatch "\.(php|asp|aspx|jsp)$">
        Require all denied
    </LocationMatch>
    
    <LocationMatch "/(wp-admin|wp-login|admin|phpmyadmin)">
        Require all denied
    </LocationMatch>
    
    # Block suspicious user agents
    RewriteEngine On
    RewriteCond %{HTTP_USER_AGENT} (sqlmap|nikto|nmap|w3af|dirbuster) [NC]
    RewriteRule .* - [F,L]
    
    # Block suspicious query strings
    RewriteCond %{QUERY_STRING} (union|select|insert|delete|update|declare|exec) [NC]
    RewriteRule .* - [F,L]
    
    # Robots.txt
    <Location "/robots.txt">
        SetHandler none
        Header set Content-Type "text/plain"
        RewriteEngine On
        RewriteRule ^robots\.txt$ - [L]
        # Serve inline robots.txt
        # Alternative: create actual robots.txt file
    </Location>
    
    # Favicon
    <Location "/favicon.ico">
        SetEnvIf Request_URI "^/favicon\.ico$" dontlog
        ExpiresActive On
        ExpiresByType image/x-icon "access plus 1 year"
        Header append Cache-Control "public, immutable"
    </Location>
    
    # Default proxy for everything else
    <Location "/">
        ProxyPass balancer://url-shortener-backend/
        ProxyPassReverse balancer://url-shortener-backend/
        
        ProxyPreserveHost On
        ProxyAddHeaders On
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
        
        ProxyTimeout 60
    </Location>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/url_shortener_error.log
    CustomLog ${APACHE_LOG_DIR}/url_shortener_access.log combined
    LogLevel warn
    
    # Custom log format with real IP
    LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" proxy
    CustomLog ${APACHE_LOG_DIR}/url_shortener_proxy.log proxy
</VirtualHost>

# API Subdomain Virtual Host (optional)
<VirtualHost *:443>
    ServerName api.yourdomain.com
    
    # Same SSL configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/yourdomain.com.crt
    SSLCertificateKeyFile /etc/ssl/private/yourdomain.com.key
    SSLCertificateChainFile /etc/ssl/certs/yourdomain.com.ca-bundle
    
    # Same SSL settings as main site
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder Off
    
    # CORS headers for API subdomain
    Header always set Access-Control-Allow-Origin "https://yourdomain.com"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    Header always set Access-Control-Allow-Credentials "true"
    
    # Handle preflight requests
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ $1 [R=204,L]
    
    # All requests go to backend
    <Location "/">
        ProxyPass balancer://url-shortener-backend/
        ProxyPassReverse balancer://url-shortener-backend/
        
        ProxyPreserveHost On
        ProxyAddHeaders On
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"
    </Location>
    
    ErrorLog ${APACHE_LOG_DIR}/url_shortener_api_error.log
    CustomLog ${APACHE_LOG_DIR}/url_shortener_api_access.log combined
</VirtualHost>

# Balancer manager (for monitoring and management)
<Location "/balancer-manager">
    SetHandler balancer-manager
    
    # Restrict access to administrators only
    Require ip 127.0.0.1
    Require ip 10.0.0.0/8
    Require ip 172.16.0.0/12
    Require ip 192.168.0.0/16
    
    # Optional: require authentication
    # AuthType Basic
    # AuthName "Balancer Manager"
    # AuthUserFile /etc/apache2/.htpasswd
    # Require valid-user
</Location>

# Enable balancer manager
ProxyPass /balancer-manager !
ProxyPass /balancer-manager balancer-manager