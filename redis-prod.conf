# Redis Production Configuration for URL Shortener
# Optimized for performance, security, and reliability

# Network and Connection Settings
bind 0.0.0.0
port 6379
tcp-keepalive 300
timeout 0

# Security Settings
requirepass ${REDIS_PASSWORD}
# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command EVAL ""

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence Configuration
# RDB Snapshots
save 900 1      # Save if at least 1 key changed in 900 seconds (15 min)
save 300 10     # Save if at least 10 keys changed in 300 seconds (5 min)
save 60 10000   # Save if at least 10000 keys changed in 60 seconds (1 min)

# RDB Settings
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File) - Disabled for better performance, RDB is sufficient
appendonly no

# Logging
loglevel notice
logfile ""
syslog-enabled no

# Performance Tuning
# Disable background saving if we have persistence issues
# stop-writes-on-bgsave-error yes

# Client Settings
# Set maximum number of connected clients
maxclients 10000

# Slow Log Configuration
slowlog-log-slower-than 10000  # Log queries slower than 10ms
slowlog-max-len 128            # Keep last 128 slow queries

# Advanced Settings
tcp-backlog 511
databases 16
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active Rehashing
activerehashing yes

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Frequency of background tasks
hz 10

# Enable dynamic HZ (adaptive frequency)
dynamic-hz yes

# Latency Monitoring
latency-monitor-threshold 100

# Notify Keyspace Events (disabled for performance)
notify-keyspace-events ""

# Advanced Memory Settings
# activedefrag yes
# active-defrag-ignore-bytes 100mb
# active-defrag-threshold-lower 10
# active-defrag-threshold-upper 100
# active-defrag-cycle-min 5
# active-defrag-cycle-max 75

# LFU (Least Frequently Used) settings
# lfu-log-factor 10
# lfu-decay-time 1

# TLS/SSL Settings (if using TLS)
# port 0
# tls-port 6380
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt
# tls-protocols "TLSv1.2 TLSv1.3"