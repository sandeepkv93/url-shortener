openapi: 3.0.3
info:
  title: URL Shortener API
  description: |
    A comprehensive URL shortener service with analytics, QR code generation, and advanced link management features.
    
    ## Authentication
    This API uses JWT Bearer token authentication. Include the token in the Authorization header:
    ```
    Authorization: Bearer <your-jwt-token>
    ```
    
    ## Rate Limiting
    - Authentication endpoints: 5 requests per minute
    - URL creation: 10 requests per minute
    - Other endpoints: 100 requests per minute
    
    ## Features
    - URL shortening with custom aliases
    - Password protection for URLs
    - URL expiration dates
    - Comprehensive analytics and reporting
    - QR code generation
    - Geographic click tracking
    - Device and browser analytics
    
  version: 1.0.0
  contact:
    name: URL Shortener API Support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.urlshortener.com/api/v1
    description: Production server

security:
  - BearerAuth: []

paths:
  # Health Check Endpoints
  /health:
    get:
      tags: [Health]
      summary: Overall health status
      description: Get comprehensive health status of the service including all components
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '206':
          description: Service is degraded but functional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /health/livez:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Kubernetes-style liveness probe indicating if the application is running
      security: []
      responses:
        '200':
          description: Application is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'

  /health/readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Kubernetes-style readiness probe indicating if the application is ready to serve traffic
      security: []
      responses:
        '200':
          description: Application is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Application is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /health/checks:
    get:
      tags: [Health]
      summary: Detailed health checks
      description: Get detailed results of all health checks
      security: []
      responses:
        '200':
          description: All critical checks passed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthChecksResponse'
        '206':
          description: Some non-critical checks failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthChecksResponse'
        '503':
          description: Critical checks failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthChecksResponse'

  /health/database:
    get:
      tags: [Health]
      summary: Database health
      description: Get database-specific health information
      security: []
      responses:
        '200':
          description: Database is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentHealth'
        '206':
          description: Database is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentHealth'
        '503':
          description: Database is down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentHealth'

  /health/cache:
    get:
      tags: [Health]
      summary: Cache health
      description: Get cache-specific health information
      security: []
      responses:
        '200':
          description: Cache is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentHealth'
        '206':
          description: Cache is degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentHealth'
        '503':
          description: Cache is down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentHealth'

  /health/metrics/system:
    get:
      tags: [Health]
      summary: System metrics
      description: Get detailed system-level metrics
      security: []
      responses:
        '200':
          description: System metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMetrics'

  /health/metrics/application:
    get:
      tags: [Health]
      summary: Application metrics
      description: Get application-specific metrics
      security: []
      responses:
        '200':
          description: Application metrics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationMetrics'

  /health/version:
    get:
      tags: [Health]
      summary: Version information
      description: Get service version and build information
      security: []
      responses:
        '200':
          description: Version information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'

  # Authentication Endpoints
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      description: Create a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user and receive JWT tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh JWT token
      description: Get a new access token using refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: Valid refresh token
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      description: Invalidate user session and tokens
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/profile:
    get:
      tags: [Authentication]
      summary: Get user profile
      description: Retrieve current user profile information
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Authentication]
      summary: Update user profile
      description: Update current user profile information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/change-password:
    post:
      tags: [Authentication]
      summary: Change user password
      description: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/validate:
    get:
      tags: [Authentication]
      summary: Validate JWT token
      description: Validate the current JWT token
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # URL Management Endpoints
  /urls:
    get:
      tags: [URLs]
      summary: Get user URLs
      description: Retrieve paginated list of user's short URLs with filtering options
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: status
          in: query
          description: Filter by URL status
          schema:
            type: string
            enum: [active, expired, inactive]
        - name: search
          in: query
          description: Search in URL or title
          schema:
            type: string
        - name: sort_by
          in: query
          description: Sort field
          schema:
            type: string
            enum: [created_at, click_count, expires_at]
            default: created_at
        - name: sort_order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: URLs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortURLListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [URLs]
      summary: Create short URL
      description: Create a new short URL with optional customization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShortURLRequest'
      responses:
        '201':
          description: Short URL created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortURLResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimit'

  /urls/popular:
    get:
      tags: [URLs]
      summary: Get popular URLs
      description: Retrieve list of popular public URLs
      security: []
      parameters:
        - name: limit
          in: query
          description: Number of URLs to return
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Popular URLs retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PopularURLResponse'

  /urls/{id}:
    get:
      tags: [URLs]
      summary: Get specific URL
      description: Retrieve details of a specific short URL
      parameters:
        - name: id
          in: path
          required: true
          description: URL ID
          schema:
            type: integer
      responses:
        '200':
          description: URL retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortURLResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [URLs]
      summary: Update URL
      description: Update an existing short URL
      parameters:
        - name: id
          in: path
          required: true
          description: URL ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShortURLRequest'
      responses:
        '200':
          description: URL updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortURLResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [URLs]
      summary: Delete URL
      description: Delete a short URL
      parameters:
        - name: id
          in: path
          required: true
          description: URL ID
          schema:
            type: integer
      responses:
        '200':
          description: URL deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # URL Redirection (Root level)
  /{shortCode}:
    get:
      tags: [Redirection]
      summary: Redirect to original URL
      description: Redirect to the original URL and record click analytics
      security: []
      parameters:
        - name: shortCode
          in: path
          required: true
          description: The short code for the URL
          schema:
            type: string
        - name: password
          in: query
          description: Password for protected URLs
          schema:
            type: string
      responses:
        '302':
          description: Redirect to original URL
          headers:
            Location:
              description: Original URL
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: URL has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Analytics Endpoints
  /analytics/dashboard:
    get:
      tags: [Analytics]
      summary: Get user dashboard
      description: Retrieve user's analytics dashboard data
      parameters:
        - name: period
          in: query
          description: Time period for analytics
          schema:
            type: string
            enum: [day, week, month, year]
            default: week
      responses:
        '200':
          description: Dashboard data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/global:
    get:
      tags: [Analytics]
      summary: Get global statistics
      description: Retrieve global platform statistics
      responses:
        '200':
          description: Global stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/top-urls:
    get:
      tags: [Analytics]
      summary: Get top performing URLs
      description: Retrieve user's top performing URLs
      parameters:
        - name: limit
          in: query
          description: Number of URLs to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: period
          in: query
          description: Time period for analysis
          schema:
            type: string
            enum: [day, week, month, year]
            default: month
      responses:
        '200':
          description: Top URLs retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopURLStat'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/export:
    get:
      tags: [Analytics]
      summary: Export analytics data
      description: Export analytics data in various formats
      parameters:
        - name: format
          in: query
          description: Export format
          schema:
            type: string
            enum: [csv, json, pdf]
            default: csv
        - name: period
          in: query
          description: Time period for export
          schema:
            type: string
            enum: [day, week, month, year]
            default: month
      responses:
        '200':
          description: Analytics data exported successfully
          content:
            application/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsExport'
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/urls/{id}:
    get:
      tags: [Analytics]
      summary: Get URL analytics
      description: Retrieve detailed analytics for a specific URL
      parameters:
        - name: id
          in: path
          required: true
          description: URL ID
          schema:
            type: integer
        - name: period
          in: query
          description: Time period for analytics
          schema:
            type: string
            enum: [day, week, month, year]
            default: month
      responses:
        '200':
          description: URL analytics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URLAnalytics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /analytics/urls/{id}/timeline:
    get:
      tags: [Analytics]
      summary: Get click timeline
      description: Retrieve click timeline for a specific URL
      parameters:
        - name: id
          in: path
          required: true
          description: URL ID
          schema:
            type: integer
        - name: granularity
          in: query
          description: Timeline granularity
          schema:
            type: string
            enum: [hour, day, week, month]
            default: day
        - name: period
          in: query
          description: Time period
          schema:
            type: string
            enum: [day, week, month, year]
            default: month
      responses:
        '200':
          description: Timeline retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /analytics/urls/{id}/geo:
    get:
      tags: [Analytics]
      summary: Get geographic statistics
      description: Retrieve geographic analytics for a specific URL
      parameters:
        - name: id
          in: path
          required: true
          description: URL ID
          schema:
            type: integer
        - name: level
          in: query
          description: Geographic detail level
          schema:
            type: string
            enum: [country, region, city]
            default: country
      responses:
        '200':
          description: Geographic stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /analytics/urls/{id}/devices:
    get:
      tags: [Analytics]
      summary: Get device statistics
      description: Retrieve device and browser analytics for a specific URL
      parameters:
        - name: id
          in: path
          required: true
          description: URL ID
          schema:
            type: integer
      responses:
        '200':
          description: Device stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /analytics/urls/{id}/referrers:
    get:
      tags: [Analytics]
      summary: Get referrer statistics
      description: Retrieve referrer analytics for a specific URL
      parameters:
        - name: id
          in: path
          required: true
          description: URL ID
          schema:
            type: integer
      responses:
        '200':
          description: Referrer stats retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefererStat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # QR Code Endpoints
  /qr/formats:
    get:
      tags: [QR Codes]
      summary: Get QR code formats
      description: Retrieve available QR code formats
      security: []
      responses:
        '200':
          description: Formats retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  enum: [png, svg, pdf, jpeg]

  /qr/sizes:
    get:
      tags: [QR Codes]
      summary: Get QR code sizes
      description: Retrieve available QR code sizes
      security: []
      responses:
        '200':
          description: Sizes retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  example: [100, 200, 300, 400, 500]

  /qr/validate:
    post:
      tags: [QR Codes]
      summary: Validate QR code options
      description: Validate QR code generation options
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRValidationRequest'
      responses:
        '200':
          description: Options are valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /qr/preview:
    post:
      tags: [QR Codes]
      summary: Get QR code preview
      description: Generate a preview of QR code without saving
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRPreviewRequest'
      responses:
        '200':
          description: Preview generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /qr/generate:
    post:
      tags: [QR Codes]
      summary: Generate QR code
      description: Generate and optionally save QR code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRGenerateRequest'
      responses:
        '200':
          description: QR code generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /qr/{shortCode}:
    get:
      tags: [QR Codes]
      summary: Generate QR code for URL
      description: Generate QR code for an existing short URL
      parameters:
        - name: shortCode
          in: path
          required: true
          description: Short code of the URL
          schema:
            type: string
        - name: format
          in: query
          description: QR code format
          schema:
            type: string
            enum: [png, svg, pdf, jpeg]
            default: png
        - name: size
          in: query
          description: QR code size in pixels
          schema:
            type: integer
            minimum: 100
            maximum: 1000
            default: 300
      responses:
        '200':
          description: QR code generated successfully
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  # Business Intelligence Endpoints
  /bi/dashboards:
    get:
      tags: [Business Intelligence]
      summary: Get user dashboards
      description: Retrieve all dashboards for the authenticated user
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
