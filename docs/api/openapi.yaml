components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for API authentication

  schemas:
    # Request Schemas
    RegisterRequest:
      type: object
      required: [email, password, first_name, last_name]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          example: password123
        first_name:
          type: string
          maxLength: 50
          example: John
        last_name:
          type: string
          maxLength: 50
          example: Doe

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: password123

    UpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 50
          example: John
        last_name:
          type: string
          maxLength: 50
          example: Doe
        email:
          type: string
          format: email
          example: newemail@example.com

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          example: oldpassword123
        new_password:
          type: string
          minLength: 8
          example: newpassword123

    CreateShortURLRequest:
      type: object
      required: [original_url]
      properties:
        original_url:
          type: string
          format: url
          example: https://www.example.com/very/long/url
        custom_alias:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
          maxLength: 50
          example: my-custom-link
        title:
          type: string
          maxLength: 255
          example: My Important Link
        description:
          type: string
          maxLength: 1000
          example: This is a link to an important resource
        password:
          type: string
          minLength: 4
          example: secret123
        expires_at:
          type: string
          format: date-time
          example: 2024-12-31T23:59:59Z

    UpdateShortURLRequest:
      type: object
      properties:
        original_url:
          type: string
          format: url
          example: https://www.example.com/updated/url
        title:
          type: string
          maxLength: 255
          example: Updated Title
        description:
          type: string
          maxLength: 1000
          example: Updated description
        is_active:
          type: boolean
          example: true
        expires_at:
          type: string
          format: date-time
          example: 2024-12-31T23:59:59Z

    QRValidationRequest:
      type: object
      required: [data]
      properties:
        data:
          type: string
          example: https://short.ly/abc123
        format:
          type: string
          enum: [png, svg, pdf, jpeg]
          default: png
        size:
          type: integer
          minimum: 100
          maximum: 1000
          default: 300

    QRPreviewRequest:
      type: object
      required: [data]
      properties:
        data:
          type: string
          example: https://short.ly/abc123
        format:
          type: string
          enum: [png, svg, pdf, jpeg]
          default: png
        size:
          type: integer
          minimum: 100
          maximum: 1000
          default: 300

    QRGenerateRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: url
          example: https://short.ly/abc123
        format:
          type: string
          enum: [png, svg, pdf, jpeg]
          default: png
        size:
          type: integer
          minimum: 100
          maximum: 1000
          default: 300

    # Response Schemas
    # Health Check Schemas
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          example: healthy
        version:
          type: string
          example: 1.0.0
        uptime:
          type: string
          example: 72h30m15s
        timestamp:
          type: string
          format: date-time
        components:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentHealth'
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthCheck'

    ComponentHealth:
      type: object
      properties:
        status:
          type: string
          enum: [up, degraded, down]
          example: up
        message:
          type: string
          example: Database is healthy
        last_checked:
          type: string
          format: date-time
        duration:
          type: string
          example: 15ms
        metadata:
          type: object
          additionalProperties: true

    HealthCheck:
      type: object
      properties:
        name:
          type: string
          example: Database Connectivity
        status:
          type: string
          enum: [pass, warn, fail]
          example: pass
        message:
          type: string
          example: Database is accessible
        critical:
          type: boolean
          example: true
        duration:
          type: string
          example: 15ms
        last_run:
          type: string
